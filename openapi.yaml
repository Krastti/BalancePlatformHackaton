  /api/comparisons/{id}/applications:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
    get:
      tags: [Comparisons]
      operationId: listComparisonApplications
      summary: Заявки завершённого запуска, отсортированные по ID
      description: Фильтры применяются совместно до пагинации. Если фильтр опущен, ограничение по нему отсутствует.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - name: hasDiff
          in: query
          schema:
            type: boolean
        - name: decisionChanged
          in: query
          schema:
            type: boolean
        - name: decisionBefore
          in: query
          schema:
            $ref: '#/components/schemas/Decision'
        - name: decisionAfter
          in: query
          schema:
            $ref: '#/components/schemas/Decision'
      responses:
        '200':
          description: Страница заявок
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonApplicationPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReportUnavailable'
  /api/comparisons/{id}/applications/{applicationId}:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
      - name: applicationId
        in: path
        required: true
        description: APP_ID из имени исходного JSON без расширения
        schema:
          type: string
          minLength: 1
          example: I32554358
    get:
      tags: [Comparisons]
      operationId: getComparisonApplication
      summary: Решения и отличия по полям одной заявки
      responses:
        '200':
          description: Детализация заявки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonApplicationDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReportUnavailable'
components:
  parameters:
    ComparisonId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    ComparisonConfiguration:
      description: Сохранённая конфигурация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ComparisonConfiguration'
    BadRequest:
      description: Некорректный JSON, идентификатор или параметр запроса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Набор, запуск или заявка в запуске не найдены
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ReportUnavailable:
      description: Отчёт доступен только в статусе COMPLETED. Для PENDING и RUNNING код COMPARISON_NOT_FINISHED, для FAILED код COMPARISON_FAILED.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  requestBodies:
    ComparisonSelection:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ComparisonSelection'
  schemas:
    AnalysisConfiguration:
      type: object
      required: [schemaVersion, name, source, normalization, analysisFields, stages, checks]
      properties:
        schemaVersion: {type: integer, enum: [2]}
        id: {type: string, format: uuid, readOnly: true}
        name: {type: string}
        source:
          type: object
          required: [kind, datasetId, format]
          properties:
            kind: {type: string, enum: [localPackage]}
            datasetId: {type: string, format: uuid}
            format: {type: string, enum: [sprJsonPair]}
        normalization: {type: array, items: {type: object}}
        analysisFields: {type: array, items: {type: object}}
        stages: {type: array, items: {type: object}}
        checks:
          type: array
          maxItems: 41
          description: Порядок шаблонов и правил. Python из редактора выполняется последним.
          items:
            type: object
            required: [id, enabled]
            properties:
              id: {type: string}
              enabled: {type: boolean}
              script: {type: object, nullable: true}
              rule:
                type: object
                nullable: true
                required: [type, label, path, source]
                properties:
                  type: {type: string, enum: [threshold, range, share, change]}
                  label: {type: string}
                  path: {type: string}
                  source: {type: string, enum: [BEFORE, AFTER]}
                  min: {type: string, description: Нижняя граница диапазона}
                  max: {type: string, description: Верхняя граница либо максимальная доля от 0 до 1}
              parameters: {type: object, nullable: true}
        legacyParameters: {type: object, nullable: true}
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    Count:
      type: integer
      format: int64
      minimum: 0
    PageMetadata:
      type: object
      required: [page, size, totalElements, totalPages]
      properties:
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 100
        totalElements:
          $ref: '#/components/schemas/Count'
        totalPages:
          type: integer
          minimum: 0
    ApplicationDataset:
      type: object
      required: [id, name, sourceRunId, applicationCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sourceRunId:
          type: string
          example: RUN-20260827-0001
        applicationCount:
          $ref: '#/components/schemas/Count'
    DatasetPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationDataset'
        page:
          $ref: '#/components/schemas/PageMetadata'
    CreateComparisonRequest:
      type: object
      additionalProperties: false
      required: [datasetId]
      oneOf:
        - not:
            anyOf:
              - required: [configurationId]
              - required: [draft]
        - required: [configurationId]
          not:
            required: [draft]
        - required: [draft]
          not:
            required: [configurationId]
      properties:
        datasetId:
          type: string
          format: uuid
        configurationId:
          type: string
          format: uuid
          description: Идентификатор конфигурации текущей рабочей области
        draft:
          $ref: '#/components/schemas/AnalysisConfiguration'
          description: Настройки для разового запуска без сохранения в списке конфигураций
    RunStatus:
      type: string
      enum: [PENDING, RUNNING, COMPLETED, FAILED]
    ComparisonSelection:
      type: object
      required: [name, datasetId, checks]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        datasetId: {type: string, format: uuid}
        checks:
          type: array
          maxItems: 40
          uniqueItems: true
          items: {type: string}
        procedure:
          type: string
          nullable: true
          description: Имя установленной процедуры сравнения
        procedureCode:
          type: string
          nullable: true
          description: Python процедуры из редактора, до 256 КиБ, взаимоисключающее с procedure поле
        checkCode:
          type: string
          nullable: true
          description: Дополнительная проверка из редактора, до 256 КиБ
        normalizer:
          type: string
          nullable: true
          description: Имя установленного нормализатора
        normalizerCode:
          type: string
          nullable: true
          description: Python нормализации из редактора, взаимоисключающее с normalizer поле
        factsProcedure:
          type: string
          nullable: true
          description: Имя установленной процедуры подготовки фактов сводной
        factsCode:
          type: string
          nullable: true
          description: Python подготовки фактов из редактора, до 256 КиБ, взаимоисключающее с factsProcedure поле
        parameters:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            procedure: {type: object}
            checks:
              type: object
              additionalProperties: {type: object}
    ComparisonConfiguration:
      allOf:
        - $ref: '#/components/schemas/ComparisonSelection'
        - type: object
          required: [id]
          properties:
            id: {type: string, format: uuid}
    ComparisonRun:
      type: object
      required: [id, datasetId, status, createdAt]
      properties:
        input:
          type: object
          properties:
            sourceRunId: {type: string}
            schemaVersion: {type: integer}
            sha256: {type: string}
            expectedSha256: {type: string}
            runtimeSha256: {type: string}
            expectedRuntimeSha256: {type: string}
        id:
          type: string
          format: uuid
        datasetId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RunStatus'
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        error:
          description: Присутствует в статусе FAILED
          allOf:
            - $ref: '#/components/schemas/ApiError'
        journal:
          description: Этапы нового запуска. У прежних запусков поле отсутствует.
          type: array
          items:
            $ref: '#/components/schemas/ComparisonStage'
        configuration:
          description: Сохранённый выбор на момент постановки в очередь. Текст редактора доступен в настройках и журнале.
          allOf:
            - $ref: '#/components/schemas/ComparisonConfiguration'
    ComparisonStage:
      type: object
      required: [name, status]
      properties:
        name: {type: string, enum: [QUEUE, NORMALIZATION, COMPARISON, CHECKS, FACTS, IMPORT]}
        status: {type: string, enum: [PENDING, RUNNING, COMPLETED, FAILED, SKIPPED]}
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
    ComparisonPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonRun'
        page:
          $ref: '#/components/schemas/PageMetadata'
    ComparisonReport:
      type: object
      required: [comparisonId, totalApplications, applicationsWithDifferences, applicationsWithDecisionChanges, transitionMatrix, checksAvailable, pivotAvailable, segmentsAvailable]
      properties:
        comparisonId:
          type: string
          format: uuid
        totalApplications:
          $ref: '#/components/schemas/Count'
        applicationsWithDifferences:
          $ref: '#/components/schemas/Count'
        applicationsWithDecisionChanges:
          $ref: '#/components/schemas/Count'
        transitionMatrix:
          $ref: '#/components/schemas/TransitionMatrix'
        checksAvailable: {type: boolean}
        pivotAvailable: {type: boolean}
        segmentsAvailable: {type: boolean}
    CheckRow:
      type: object
      required: [LABEL, SOURCE, ARGUMENT, CNT, TOTAL, METRIC, APP_IDS, RESULT, CONFIDENCE]
      properties:
        LABEL: {type: string}
        SOURCE: {type: string, enum: [BEFORE, AFTER]}
        ARGUMENT: {type: string}
        CNT: {type: integer, minimum: 0}
        TOTAL: {type: integer, minimum: 0}
        METRIC: {type: number}
        APP_IDS:
          type: array
          items: {type: string}
        RESULT:
          type: string
          enum: [PASS, FAIL, SIGNAL]
          description: PASS означает соблюдение критерия, FAIL — нарушение критерия, SIGNAL — обнаруженное изменение без утверждения о нарушении.
        CONFIDENCE: {type: string, enum: [HIGH, LOW]}
    PivotCount:
      type: object
      required: [row, column, count]
      properties:
        row: {type: string}
        column: {type: string}
        count: {type: integer, minimum: 1}
        affectedApplications:
          type: integer
          minimum: 1
          description: Уникальные заявки с изменением поля во всех его значениях и срезах, для IMPACT
    PivotTreeCount:
      type: object
      required: [level, path, column, count]
      properties:
        level: {type: string, enum: [PREFIX, CLASS, SUFFIX, ARRAY_KEY, KEY]}
        path:
          type: array
          items: {type: string}
          description: Значения координат группы по уровням от PREFIX
        column: {type: string}
        count: {type: integer, minimum: 1, description: Уникальные заявки в группе и столбце}
    PivotAttribute:
      type: object
      required: [path, arrayKey, valueBefore, valueAfter, changeType]
      properties:
        path: {type: string}
        arrayKey: {type: string}
        valueBefore: {type: string, nullable: true}
        valueAfter: {type: string, nullable: true}
        changeType: {type: string, enum: [SAME, VALUE_CHANGED, ATTRIBUTE_NEW, ATTRIBUTE_LOST]}
    TransitionMatrix:
      type: object
      required: [approveToApprove, approveToReject, rejectToApprove, rejectToReject]
      properties:
        approveToApprove:
          $ref: '#/components/schemas/Count'
        approveToReject:
          $ref: '#/components/schemas/Count'
        rejectToApprove:
          $ref: '#/components/schemas/Count'
        rejectToReject:
          $ref: '#/components/schemas/Count'
    Decision:
      type: string
      enum: [APPROVE, REJECT]
    ComparisonApplicationSummary:
      type: object
      required: [applicationId, decisionBefore, decisionAfter, hasDiff, decisionChanged]
      properties:
        applicationId:
          type: string
          example: I32554358
        decisionBefore:
          $ref: '#/components/schemas/Decision'
        decisionAfter:
          $ref: '#/components/schemas/Decision'
        hasDiff:
          type: boolean
        decisionChanged:
          type: boolean
    ComparisonApplicationPage:
      type: object
      required: [items, page]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ComparisonApplicationSummary'
        page:
          $ref: '#/components/schemas/PageMetadata'
    ComparisonApplicationDetail:
      allOf:
        - $ref: '#/components/schemas/ComparisonApplicationSummary'
        - type: object
          required: [differences]
          properties:
            differences:
              type: array
              description: Отличия в порядке пути и ключа массива
              items:
                $ref: '#/components/schemas/AttributeDifference'
    AttributeDifference:
      type: object
      required: [path, arrayKey, valueBefore, valueAfter, changeType]
      properties:
        path:
          type: string
        arrayKey:
          type: string
          description: Пустая строка для поля вне массива
        valueBefore:
          type: string
          nullable: true
          description: null для отсутствующего поля. Исходное значение JSON null представлено строкой NULL.
        valueAfter:
          type: string
          nullable: true
          description: null для отсутствующего поля. Исходное значение JSON null представлено строкой NULL.
        changeType:
          type: string
          enum: [VALUE_CHANGED, ATTRIBUTE_NEW, ATTRIBUTE_LOST]
