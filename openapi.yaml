        - name: segment
          in: query
          schema: {type: string, enum: [PRODUCT, PARTNER_TYPE, ROUTING_METHOD, PD_MODEL_AFTER]}
        - name: segmentValue
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
        - name: rowValue
          in: query
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - name: columnValue
          in: query
