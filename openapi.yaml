openapi: 3.0.3
info:
  title: BalancePlatform — API первого сквозного MVP
  version: 0.3.0
  description: |
    Целевой контракт сравнения готовых ответов СПР.
    Наборы регистрируются на сервере и содержат оба среза.
    Сравнение выполняется в фоне. Отчёт доступен после успешного импорта.
tags:
  - name: Datasets
  - name: Comparisons
paths:
  /api/datasets:
    get:
      tags: [Datasets]
      operationId: listDatasets
      summary: Список доступных наборов
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница наборов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DatasetPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/comparisons/datasets/{datasetId}/preview:
    get:
      tags: [Datasets]
      operationId: previewDataset
      summary: Пример пары решений из выбранного набора
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Метки срезов и решения по одной заявке
          content:
            application/json:
              schema:
                type: object
                required: [applicationId, beforeLabel, afterLabel, decisionBefore, decisionAfter]
                properties:
                  applicationId: {type: string}
                  beforeLabel: {type: string}
                  afterLabel: {type: string}
                  decisionBefore: {type: string, enum: [APPROVE, REJECT]}
                  decisionAfter: {type: string, enum: [APPROVE, REJECT]}
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Пара ответов недоступна для предпросмотра
  /api/comparisons/datasets/{datasetId}/normalization-preview:
    post:
      tags: [Datasets]
      operationId: previewNormalization
      summary: Применить правила черновика к примеру пары
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 100
              items:
                type: object
                required: [sourcePath, targetPath, type, excluded, arrayKeys]
                properties:
                  sourcePath: {type: array, items: {type: string}}
                  targetPath: {type: array, items: {type: string}}
                  type: {type: string, enum: [keep, string, number, boolean]}
                  excluded: {type: boolean}
                  arrayKeys: {type: array, items: {type: string}}
      responses:
        '200':
          description: До 25 строк на срез в before и after либо диагностика в error
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Пример пары недоступен
  /api/comparisons/datasets/{datasetId}/analysis-preview:
    post:
      tags: [Datasets]
      operationId: previewAnalysisFields
      summary: Показать группировку черновика на одной паре
      parameters:
        - name: datasetId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [normalization, analysisFields]
              properties:
                normalization: {type: array, maxItems: 100, items: {type: object}}
                analysisFields:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [path, label, role, buckets]
                    properties:
                      path: {type: array, items: {type: string}}
                      label: {type: string}
                      role: {type: string, enum: [group]}
                      buckets:
                        type: array
                        items:
                          type: object
                          required: [upper, label]
                          properties:
                            upper: {type: string, nullable: true}
                            label: {type: string}
      responses:
        '200':
          description: До 25 строк на срез с исходным значением и группой либо диагностика
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Пример пары недоступен
  /api/comparisons:
    post:
      tags: [Comparisons]
      operationId: createComparison
      description: Перед созданием вызовите GET /api/comparisons/workspace и передавайте cookie BALANCE_WORKSPACE.
      summary: Запустить сравнение двух срезов выбранного набора
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComparisonRequest'
      responses:
        '202':
          description: Запуск поставлен в очередь
          headers:
            Location:
              description: Путь к статусу запуска
              schema:
                type: string
                example: /api/comparisons/cecc2359-b397-46ef-b55c-6a8232aa69e8
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    get:
      tags: [Comparisons]
      operationId: listComparisons
      summary: История запусков, от новых к старым
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница запусков
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonPage'
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/comparisons/workspace:
    get:
      tags: [Comparisons]
      operationId: initializeComparisonWorkspace
      summary: Инициализировать рабочую область браузера
      responses:
        '204':
          description: Рабочая область доступна, новому браузеру выдана cookie
  /api/comparisons/configurations:
    get:
      tags: [Comparisons]
      operationId: listComparisonConfigurations
      summary: Сохранённые конфигурации рабочей области
      responses:
        '200':
          description: Список конфигураций
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComparisonConfiguration'
    post:
      tags: [Comparisons]
      operationId: createComparisonConfiguration
      summary: Сохранить новую конфигурацию
      requestBody:
        $ref: '#/components/requestBodies/ComparisonSelection'
      responses:
        '200':
          $ref: '#/components/responses/ComparisonConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/comparisons/configurations/{configurationId}:
    parameters:
      - name: configurationId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      tags: [Comparisons]
      operationId: updateComparisonConfiguration
      summary: Обновить свою конфигурацию
      requestBody:
        $ref: '#/components/requestBodies/ComparisonSelection'
      responses:
        '200':
          $ref: '#/components/responses/ComparisonConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/comparisons/configurations/{configurationId}/v2:
    get:
      tags: [Comparisons]
      operationId: readComparisonConfigurationV2
      summary: Открыть сохранённую конфигурацию в модели v2
      parameters:
        - name: configurationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Представление сохранённых настроек для обоих режимов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisConfiguration'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Comparisons]
      operationId: updateComparisonConfigurationV2
      summary: Обновить свою конфигурацию в модели v2
      parameters:
        - name: configurationId
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisConfiguration'
      responses:
        '200':
          description: Сохранённые настройки в модели v2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/comparisons/configurations/v2:
    get:
      tags: [Comparisons]
      operationId: listComparisonConfigurationsV2
      summary: Конфигурации текущей рабочей области в модели v2
      responses:
        '200':
          description: Сохранённые конфигурации
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AnalysisConfiguration'
    post:
      tags: [Comparisons]
      operationId: createComparisonConfigurationV2
      summary: Создать конфигурацию в модели v2
      description: Для текущего исполнителя используйте пять этапов из примера и идентификатор из каталога наборов. Этапы CHECKS и FACTS можно поменять местами.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisConfiguration'
            example:
              schemaVersion: 2
              name: Штатное сравнение
              source:
                kind: localPackage
                datasetId: 29fa0db9-4d71-415c-a399-c92df7059271
                format: sprJsonPair
              normalization: []
              analysisFields: []
              stages:
                - {id: normalize, type: NORMALIZATION, enabled: false, script: {kind: default}}
                - {id: compare, type: COMPARISON, enabled: true, script: {kind: default}}
                - {id: checks, type: CHECKS, enabled: false, script: {kind: default}}
                - {id: facts, type: FACTS, enabled: false, script: {kind: default}}
                - {id: publish, type: IMPORT, enabled: true, script: {kind: default}}
              checks: []
      responses:
        '200':
          description: Сохранённые настройки в модели v2
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/comparisons/configurations/scripts/source:
    get:
      tags: [Comparisons]
      operationId: copyConfigurationScript
      summary: Получить редактируемую копию файла каталога
      parameters:
        - name: kind
          in: query
          required: true
          schema: {type: string, enum: [check, procedure]}
        - name: name
          in: query
          required: true
          schema: {type: string}
      responses:
        '200':
          description: Код в UTF-8
          content:
            application/json:
              schema:
                type: object
                required: [code]
                properties:
                  code: {type: string}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/comparisons/configurations/scripts/validate:
    post:
      tags: [Comparisons]
      operationId: validateConfigurationScript
      summary: Статически проверить код без исполнения
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: {type: string}
      responses:
        '200':
          description: Результат синтаксической проверки и признак объявления CHECK
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/comparisons/{id}/journal/parameters:
    get:
      tags: [Comparisons]
      operationId: readFrozenRunParameters
      summary: Параметры из снимка запуска
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Параметры либо пустой объект
        '404':
          $ref: '#/components/responses/NotFound'
  /api/comparisons/configurations/checks:
    get:
      tags: [Comparisons]
      operationId: listComparisonCheckFiles
      summary: Имена доступных файлов проверок
      responses:
        '200':
          description: Доступные файлы
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
        '503':
          description: Настроенный каталог проверок недоступен
  /api/comparisons/configurations/procedures:
    get:
      tags: [Comparisons]
      operationId: listComparisonProcedures
      summary: Имена доступных файлов процедур сравнения
      responses:
        '200':
          description: Доступные процедуры
          content:
            application/json:
              schema:
                type: array
                items: {type: string}
        '503':
          description: Настроенный каталог процедур недоступен
  /api/comparisons/{id}:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
    get:
      tags: [Comparisons]
      operationId: getComparison
      summary: Статус запуска
      responses:
        '200':
          description: Текущее состояние запуска
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonRun'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/comparisons/{id}/journal/{stage}/source:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
      - name: stage
        in: path
        required: true
        schema: {type: string, enum: [NORMALIZATION, COMPARISON, CHECKS, FACTS]}
    get:
      tags: [Comparisons]
      operationId: getComparisonStageSource
      summary: Сохранённые исходники этапа
      responses:
        '200':
          description: Файлы этапа в порядке подготовки
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, content]
                  properties:
                    name: {type: string}
                    content: {type: string}
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/comparisons/{id}/report:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
    get:
      tags: [Comparisons]
      operationId: getComparisonReport
      summary: Счётчики и матрица переходов завершённого запуска
      responses:
        '200':
          description: Сводка сравнения
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonReport'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReportUnavailable'
  /api/comparisons/{id}/replay:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
    post:
      tags: [Comparisons]
      operationId: replayComparison
      summary: Повторить завершённый запуск из сохранённого снимка
      responses:
        '202':
          description: Повтор поставлен в очередь
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComparisonRun'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Запуск не содержит необходимых отпечатков и снимка
  /api/comparisons/{id}/checks:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
    get:
      tags: [Comparisons]
      operationId: getComparisonChecks
      summary: Общая таблица вердиктов и список исполненных проверок
      responses:
        '200':
          description: Сохранённый отчёт проверок
          content:
            application/json:
              schema:
                type: object
                required: [checks, rows, skipped]
                properties:
                  checks:
                    type: array
                    items:
                      type: object
                      required: [id, label, row_count]
                      properties:
                        id: {type: string}
                        label: {type: string}
                        row_count: {type: integer, minimum: 0}
                        status: {type: string, enum: [NO_DATA, ERROR]}
                        message: {type: string, description: Диагностика отдельной проверки со статусом ERROR}
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [id, label, status]
                      properties:
                        id: {type: string}
                        label: {type: string}
                        status: {type: string, enum: [SKIPPED]}
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckRow'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReportUnavailable'
  /api/comparisons/{id}/checks.html:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
    get:
      tags: [Comparisons]
      operationId: getComparisonChecksHtml
      summary: Автономный HTML-отчёт со ссылками в приложение
      parameters:
        - name: download
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Отчёт для просмотра или скачивания
          content:
            text/html:
              schema: {type: string}
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReportUnavailable'
  /api/comparisons/{id}/pivot:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
    get:
      tags: [Comparisons]
      operationId: getComparisonPivot
      summary: Группы сводной с числом уникальных заявок
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: rows
          in: query
          schema: {type: string, enum: [PATH, PATH_VALUE, FIELD_VALUES, IMPACT, PREFIX, CLASS, SUFFIX, KEY, ARRAY_KEY, VALUE], default: PATH}
        - name: columns
          in: query
          schema: {type: string, enum: [SOURCE, CHANGE_TYPE, DIFF_FLAG, SOURCE_DIFF], default: SOURCE_DIFF}
        - name: prefix
          in: query
          description: Префикс поля. Для FIELD_VALUES указывается точный путь поля.
          schema: {type: string}
        - name: segment
          in: query
          schema: {type: string, enum: [PRODUCT, PARTNER_TYPE, ROUTING_METHOD, PD_MODEL_AFTER]}
        - name: segmentValue
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
        - name: rowValue
          in: query
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - name: columnValue
          in: query
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - name: filterRows
          in: query
          description: true при включённом фильтре строк; пустой список означает отсутствие строк.
          schema: {type: boolean, default: false}
        - name: filterColumns
          in: query
          description: true при включённом фильтре столбцов; пустой список означает отсутствие столбцов.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Страница из 25 групп, заявок или атрибутов
          content:
            application/json:
              schema:
                type: object
                required: [items, hasNext]
                properties:
                  hasNext: {type: boolean}
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PivotCount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReportUnavailable'
  /api/comparisons/{id}/pivot/field-labels:
    get:
      tags: [Comparisons]
      operationId: readPivotFieldLabels
      summary: Подписи полей из снимка опубликованного запуска
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Подписи по исходным путям
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {type: string}
        '404':
          $ref: '#/components/responses/NotFound'
  /api/comparisons/{id}/pivot/dimension-values:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
    get:
      tags: [Comparisons]
      operationId: listComparisonPivotDimensionValues
      summary: Значения строк или столбцов для фильтра сводной
      parameters:
        - name: rows
          in: query
          required: true
          schema: {type: string, enum: [PATH, PATH_VALUE, FIELD_VALUES, IMPACT, PREFIX, CLASS, SUFFIX, KEY, ARRAY_KEY, VALUE]}
        - name: columns
          in: query
          schema: {type: string, enum: [SOURCE, CHANGE_TYPE, DIFF_FLAG, SOURCE_DIFF], default: SOURCE_DIFF}
        - name: prefix
          in: query
          schema: {type: string}
        - name: axis
          in: query
          required: true
          schema: {type: string, enum: [ROW, COLUMN]}
        - name: segment
          in: query
          schema: {type: string, enum: [PRODUCT, PARTNER_TYPE, ROUTING_METHOD, PD_MODEL_AFTER]}
        - name: segmentValue
          in: query
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
      responses:
        '200':
          description: Отсортированные уникальные значения выбранной оси
          content:
            application/json:
              schema: {type: array, items: {type: string}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/comparisons/{id}/pivot/segment-values:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
    get:
      tags: [Comparisons]
      operationId: listComparisonPivotSegmentValues
      summary: Значения выбранного поля разреза
      parameters:
        - name: segment
          in: query
          required: true
          schema: {type: string, enum: [PRODUCT, PARTNER_TYPE, ROUTING_METHOD, PD_MODEL_AFTER]}
      responses:
        '200':
          description: Отсортированные уникальные значения из запуска
          content:
            application/json:
              schema: {type: array, items: {type: string}}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/comparisons/{id}/pivot/tree-counts:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
    get:
      tags: [Comparisons]
      operationId: getComparisonPivotTreeCounts
      summary: Уникальные счётчики заявок для групп дерева
      parameters:
        - name: rows
          in: query
          required: true
          schema: {type: string, enum: [PATH_VALUE, FIELD_VALUES, IMPACT]}
        - name: columns
          in: query
          schema: {type: string, enum: [SOURCE, CHANGE_TYPE, DIFF_FLAG, SOURCE_DIFF], default: SOURCE_DIFF}
        - name: prefix
          in: query
          schema: {type: string}
        - name: segment
          in: query
          schema: {type: string, enum: [PRODUCT, PARTNER_TYPE, ROUTING_METHOD, PD_MODEL_AFTER]}
        - name: segmentValue
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
        - name: rowValue
          in: query
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - name: columnValue
          in: query
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - name: filterRows
          in: query
          schema: {type: boolean, default: false}
        - name: filterColumns
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: Счётчики для родительских узлов, до пагинации листьев
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/PivotTreeCount'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/ReportUnavailable'}
  /api/comparisons/{id}/pivot/applications:
