        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReportUnavailable'
  /api/comparisons/{id}/pivot/applications/{applicationId}/attributes:
    parameters:
      - $ref: '#/components/parameters/ComparisonId'
      - name: applicationId
