        - name: columns
          in: query
          required: true
          schema: {type: string, enum: [SOURCE, CHANGE_TYPE, DIFF_FLAG, SOURCE_DIFF]}
        - name: prefix
          in: query
          description: Префикс поля. Для FIELD_VALUES указывается точный путь поля.
          schema: {type: string}
        - name: segment
          in: query
          schema: {type: string, enum: [PRODUCT, PARTNER_TYPE, ROUTING_METHOD, PD_MODEL_AFTER]}
        - name: segmentValue
          in: query
          style: form
          explode: true
          schema:
            type: array
            items: {type: string}
        - name: rowValue
          in: query
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - name: columnValue
