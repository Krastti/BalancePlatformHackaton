spring.application.name=BalancePlatform
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/balanceplatform}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:balanceplatform}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.deserialization.use-big-decimal-for-floats=true
balance.worker.poll-delay-ms=${BALANCE_WORKER_POLL_DELAY_MS:1000}
balance.datasets.path=${BALANCE_DATASETS_PATH:data}
balance.dataset.path=${BALANCE_DATASET_PATH:}
balance.python.executable=${BALANCE_PYTHON_EXECUTABLE:python3}
balance.python.script=${BALANCE_PYTHON_SCRIPT:python-src/compare_dataset.py}
balance.python.check-script=${BALANCE_PYTHON_CHECK_SCRIPT:python-src/run_check.py}
balance.python.check-snapshot-map=${BALANCE_PYTHON_CHECK_SNAPSHOT_MAP:false}
balance.procedures.path=${BALANCE_PROCEDURES_PATH:}
balance.checks.path=${BALANCE_CHECKS_PATH:}
balance.python.timeout=${BALANCE_PYTHON_TIMEOUT:PT5M}

balance.python.sandbox-enabled=${BALANCE_PYTHON_SANDBOX_ENABLED:false}
