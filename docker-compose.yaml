name: balanceplatform

services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-balanceplatform}
      POSTGRES_USER: ${POSTGRES_USER:-balanceplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env или окружении}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-balanceplatform}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-balanceplatform}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env или окружении}
      BALANCE_WORKER_POLL_DELAY_MS: ${BALANCE_WORKER_POLL_DELAY_MS:-1000}
      BALANCE_DATASETS_PATH: /app/data
      BALANCE_CHECKS_PATH: "${BALANCE_CHECKS_PATH:+/checks}"
      BALANCE_PYTHON_TIMEOUT: ${BALANCE_PYTHON_TIMEOUT:-PT5M}
    volumes:
      - type: bind
        source: "${BALANCE_DATASETS_PATH:-./data}"
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
      - "${BALANCE_CHECKS_PATH:-balance_checks}:/checks:ro"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    stop_grace_period: 30s

volumes:
  postgres_data:
  balance_checks:
